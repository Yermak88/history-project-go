<!DOCTYPE html>
<html>
    <head>
        <title>Исторические События</title>
    </head>
    <body>
        <h1>Все события</h1>

        <input id="filterEventsByYearInput" type="number" placeholder="Год">
        <button onclick="eventsByYear()">Показать события по году</button>

        <div id="allEventsByYear"></div>

        <div id="allEventsByYearRange"></div>
        <input id="filterYearFromInput" type="number" placeholder="От">
        <input id="filterYearToInput" type="number" placeholder="До">
        <button onclick="eventsByYearRange()">Показать события в определенном промежутке лет</button>

        <input id="filterEventsByCountryInput" type="text" placeholder="название страны">
        <button onclick="eventsByCountry()">Показать события по стране</button>
        <div id="eventsByCountryFilter"></div>

        <input id="filterEventsBySearchInput" type="text" placeholder="поиск по ключевому слову">
        <button onclick="eventsBySearch()">Показать события по ключевому слову</button>
        <div id="eventsByDescriptionSearch"></div>

        <h1>Викторина - укажи год события</h1>
        <button onclick="startQuiz()">Начать викторину</button>
        <div id="quizQuestion"></div>

        <input id="quizYearInput" type="number" placeholder="Твой ответ (год)">
        <button onclick="checkQuizAnswer()">Ответить</button>
        <p id="quizResult"></p>
        <p id="quizScore">Счёт: 0 из 0</p>

    


        <h1>Добавить событие</h1>

        <input id="year" type="number" placeholder="год">
        <input id="description" type="text" placeholder="описание">
        <input id="country" type="text" placeholder="страна">
        <button onclick="addEvent()">Добавить</button>

        <p id="result"></p>

        <h1>Удалить событие</h1>
        <input id="deleteDescription" type="text" placeholder="Описание">
        <button onclick="deleteEvent()">Удалить</button>

        <p id="deleteResult"></p>

        <h1>Изменить событие</h1>
        <input id="oldDescription" type="text" placeholder="Старое описание">
        <input id="newYear" type="number" placeholder="Новая дата">
        <input id="newDescription" type="text" placeholder="Новое описание">
        <input id="newCountry" type="text" placeholder="Новая страна">
        <button onclick="updateEvent()">Изменить</button>

        <p id="updateResult"></p>

        <button onclick="showAllEvents()">Показать все события</button>

        <button onclick="toggleEvents()">Показать/Скрыть все события</button>
                <div id="allEvents"></div>



        <script>    

            function showAllEvents() {
                    console.log("Функция вызвана")
                    fetch("/events")
    .then(r => r.json())
    .then(events => {

    let html = ""
        for (const event of events){
            html = html + "<p>" + event.year + " " + event.description + " " + event.country + "</p>"
        }
        document.getElementById("allEvents").innerHTML = html
        document.getElementById("allEvents").style.display = "block"

    })
}


     function toggleEvents() {
                const eventsDiv = document.getElementById("allEvents")

                if (eventsDiv.style.display === "none") {
                    eventsDiv.style.display = "block" 
                } else {
                    eventsDiv.style.display = "none"
                }
            }

        function eventsByYear() {
            const year = parseInt(document.getElementById("filterEventsByYearInput").value)
            fetch("/events?year=" + year)
            .then(r => r.json())
            .then(events => {
                let html = ""
                for (const event of events) {
                    html = html + "<p>" + event.year + " " + event.description + " " + event.country + "</p>"
                }
                document.getElementById("allEventsByYear").innerHTML = html
            })
        } 

        function eventsByYearRange() {
            const yearFrom = parseInt(document.getElementById("filterYearFromInput").value)
            const yearTo = parseInt(document.getElementById("filterYearToInput").value)
            fetch("/events?yearFrom=" + yearFrom + "&yearTo=" + yearTo)
            .then(r => r.json())
            .then(events => {
                let html = ""
                for (const event of events) {
                    html = html + "<p>" + event.year + " " + event.description + " " + event.country + "</p>"
                }
                document.getElementById("allEventsByYearRange").innerHTML = html
            })
        } 

        function eventsByCountry() {
            const country = document.getElementById("filterEventsByCountryInput").value
            fetch("/events?country=" + country)
            .then(r => r.json())
            .then(events => {
                let html = ""
                for (const event of events) {
                    html = html + "<p>" + event.year + " " + event.description + " " + event.country + "</p>"
                }
                document.getElementById("eventsByCountryFilter").innerHTML = html
            })
        }

        function eventsBySearch() {
            const search = document.getElementById("filterEventsBySearchInput").value
            fetch("/events?search=" + search)
            .then(r => r.json())
            .then(events => {
                let html = ""
                for (const event of events) {
                    html = html + "<p>" + event.year + " " + event.description + " " + event.country + "</p>"
                }
                document.getElementById("eventsByDescriptionSearch").innerHTML = html
            })
        }

        let correctYear = null
        let correctAnswersCount = 0
        let totalAnswersCount = 0

        function startQuiz() {
            fetch("/events")
            .then(r => r.json())
            .then(events => {
                const randomIndex = Math.floor(Math.random() * events.length)
                const randomEvent = events[randomIndex]

                correctYear = randomEvent.year

                document.getElementById("quizQuestion").innerHTML = 
                "<p>" + randomEvent.description + "</p>"

                    document.getElementById("quizResult").innerText = ""
            }) 
        }

        function checkQuizAnswer() {
            const userAnswer = parseInt(document.getElementById("quizYearInput").value)

            totalAnswersCount = totalAnswersCount + 1

            if (userAnswer === correctYear) {
                correctAnswersCount = correctAnswersCount + 1
                document.getElementById("quizResult").innerText = "Верно"
            } else {
                document.getElementById("quizResult").innerText = "Неверно. Правильный ответ - " + correctYear
            }
            document.getElementById("quizScore").innerText = "Счёт: " + correctAnswersCount + " из " + totalAnswersCount
        }
            
        function addEvent() {
                const year = parseInt(document.getElementById("year").value)
                const description = document.getElementById("description").value
                const country = document.getElementById("country").value

                fetch("/events/add", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({year, description, country})
                })
                .then(r => r.text())
                .then(data => {
                    document.getElementById("result").innerText = data
                })
            }

        

            function updateEvent() {
                const oldDescription = document.getElementById("oldDescription").value
                const year = parseInt(document.getElementById("newYear").value)
                const description = document.getElementById("newDescription").value
                const country = document.getElementById("newCountry").value

                fetch("/events/update", {
                    method: "POST",
                    headers: {"Content-Type": "application/json" },
                    body: JSON.stringify({oldDescription, year, description, country}) 

                })
                .then(r => r.text())
                .then(data => {
                    document.getElementById("updateResult").innerText = data
                })
            }

            function deleteEvent() {
                const description = document.getElementById("deleteDescription").value

                fetch("/events/delete", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({year: 0, description, country: ""})
                })
                .then(r => r.text())
                .then(data => {
                    document.getElementById("deleteResult").innerText = data
                })

            }

          

            
        </script>


    </body>
</html>
